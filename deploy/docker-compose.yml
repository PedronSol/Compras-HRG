# Implantação de referência: PostgreSQL + API (Flask/gunicorn) + Nginx (TLS).
# Uso:
#   cp deploy/.env.producao.example deploy/.env.producao   # preencha segredos
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env.producao up -d --build
#   docker compose -f deploy/docker-compose.yml exec api python -m rg.cli criar-admin
name: rg-hospital

services:
  banco:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?defina PG_SUPERUSER_PASSWORD}
      RG_OWNER_PASSWORD: ${RG_OWNER_PASSWORD:?defina RG_OWNER_PASSWORD}
      RG_API_PASSWORD: ${RG_API_PASSWORD:?defina RG_API_PASSWORD}
    volumes:
      - dados-pg:/var/lib/postgresql/data
      - ./postgres/init-papeis.sh:/docker-entrypoint-initdb.d/10-init-papeis.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
    networks: [interna]

  migracoes:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["python", "-m", "rg.cli", "migrar"]
    environment:
      RG_DATABASE_URL: postgresql://rg_owner:${RG_OWNER_PASSWORD}@banco:5432/rg_hospital
    depends_on:
      banco: { condition: service_healthy }
    networks: [interna]
    restart: "no"

  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: .env.producao
    environment:
      RG_DATABASE_URL: postgresql://rg_api:${RG_API_PASSWORD}@banco:5432/rg_hospital
      RG_DB_APP_ROLE: rg_app
      RG_TRUSTED_PROXIES: "1"
      RG_SESSION_COOKIE_SECURE: "true"
    volumes:
      - arquivos:/data/storage
    depends_on:
      migracoes: { condition: service_completed_successfully }
    networks: [interna]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?defina TLS_CERT_DIR}:/etc/nginx/certs:ro
    depends_on: [api]
    networks: [interna]

volumes:
  dados-pg:
  arquivos:

networks:
  interna:
